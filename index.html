        const CHART_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
        
        const PremiumChart = ({ activeProducts, age, gender }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const chartInfo = useMemo(() => {
                if (activeProducts.length === 0) return { chartData: [], productsData: [], cumulativeList: [] };
                
                let maxAge = age;
                const cumulativeList = []; // 儲存個別商品的累積保費
                
                const productsData = activeProducts.map(({ product, settings, result }, index) => {
                    if (result.isUninsurable) return null;
                    
                    let schedule = {};
                    const isMale = gender === 'M';
                    const { sumAssured, term } = settings;
                    const isCombo = product.id === 'HCAB2_HCAR2';
                    const units = isCombo ? sumAssured : sumAssured / product.rateUnit;
                    const color = CHART_COLORS[index % CHART_COLORS.length]; // 抓取專屬顏色

                    // 記錄到個別累積保費清單中
                    cumulativeList.push({
                        id: product.id,
                        name: product.englishCode,
                        cumulative: result.cumulativePremium,
                        color: color
                    });

                    if (isCombo) {
                        const hcabRate = isMale ? rateHCAB2_M[age] : rateHCAB2_F[age];
                        const hcarRate = isMale ? rateHCAR2_M[age] : rateHCAR2_F[age];
                        const premium = Math.round((hcabRate + hcarRate) * units);
                        for (let i = 0; i < term; i++) schedule[age + i] = premium;
                        maxAge = Math.max(maxAge, age + term - 1);
                    } else if (product.id === '1TED') {
                        const initialRate = isMale ? rate1TED_Initial_M[age] : rate1TED_Initial_F[age];
                        schedule[age] = Math.round(initialRate * units);
                        maxAge = Math.max(maxAge, age);
                        for (let a = age + 1; a <= 75; a++) {
                            const renewalRate = isMale ? rate1TED_Renewal_M[a - 1] : rate1TED_Renewal_F[a - 1];
                            if (renewalRate) {
                                schedule[a] = Math.round(renewalRate * units);
                                maxAge = Math.max(maxAge, a);
                            }
                        }
                    } else if (product.id === '10TDD') {
                        let currentRenewalAge = age;
                        while (currentRenewalAge <= 70) {
                            const indexOffset = currentRenewalAge - 20;
                            const currentRate = isMale ? rate10TDD_M[indexOffset] : rate10TDD_F[indexOffset];
                            const premium = Math.round(currentRate * units);
                            for(let i = 0; i < 10; i++) schedule[currentRenewalAge + i] = premium;
                            maxAge = Math.max(maxAge, currentRenewalAge + 9);
                            currentRenewalAge += 10;
                        }
                    } else {
                        const premium = Math.round(getBaseRate(product.id, age, gender, term) * units);
                        for (let i = 0; i < term; i++) schedule[age + i] = premium;
                        maxAge = Math.max(maxAge, age + term - 1);
                    }
                    return { id: product.id, name: product.englishCode, schedule, color };
                }).filter(Boolean);

                const chartData = [];
                for (let a = age; a <= maxAge; a++) {
                    let dataPoint = { age: a, ageLabel: `${a}歲` };
                    let hasPremium = false;
                    productsData.forEach(p => {
                        if (p.schedule[a] !== undefined) {
                            dataPoint[p.id] = p.schedule[a];
                            hasPremium = true;
                        }
                    });
                    if (hasPremium) chartData.push(dataPoint);
                }

                return { chartData, productsData, cumulativeList };
            }, [activeProducts, age, gender]);

            useEffect(() => {
                if (!chartRef.current || chartInfo.chartData.length === 0) return;
                
                const ctx = chartRef.current.getContext('2d');
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const labels = chartInfo.chartData.map(d => d.ageLabel);
                const datasets = chartInfo.productsData.map((p) => {
                    const data = chartInfo.chartData.map(d => d[p.id] !== undefined ? d[p.id] : null);
                    return {
                        label: p.name,
                        data: data,
                        borderColor: p.color,
                        backgroundColor: p.color,
                        borderWidth: 3,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        spanGaps: false, // 關鍵：保費歸零後斷開連線
                        tension: 0.1
                    };
                });

                chartInstance.current = new window.Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) label += ': ';
                                        if (context.parsed.y !== null) {
                                            label += formatSysCcy(context.parsed.y);
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                ticks: {
                                    callback: function(value) {
                                        return value >= 10000 ? (value / 10000) + '萬' : value;
                                    },
                                    font: { weight: 'bold' }
                                },
                                grid: { drawBorder: false }
                            },
                            x: {
                                ticks: { font: { weight: 'bold' } },
                                grid: { display: false, drawBorder: false }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [chartInfo]);

            if (chartInfo.chartData.length === 0) return null;

            return (
                <div className="bg-white rounded-2xl shadow-sm p-6 border border-slate-100 mt-8 relative">
                    <h3 className="text-xl font-black text-slate-800 mb-4 flex items-center gap-2">
                        <i className="fa-solid fa-chart-line text-indigo-600"></i> 各商品年繳保費走勢與預估累積總繳
                    </h3>
                    
                    {/* 改為顯示個別商品的累積保費，並對應圖表線條顏色 */}
                    <div className="flex flex-wrap gap-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        {chartInfo.cumulativeList.map(item => (
                            <div key={item.id} className="flex items-center gap-2 bg-white border border-slate-200 px-3 py-2 rounded-lg shadow-sm">
                                <span className="w-3 h-3 rounded-full shadow-sm" style={{ backgroundColor: item.color }}></span>
                                <span className="text-sm font-bold text-slate-600">{item.name}</span>
                                <span className="text-sm font-black text-slate-800 ml-1">{formatSysCcy(item.cumulative)}</span>
                            </div>
                        ))}
                    </div>

                    <div className="h-[400px] w-full relative">
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            );
        };

        // --- 主應用組件 ---
        const App = () => {
            const [gender, setGender] = useState('F');
            const [age, setAge] = useState(30);
            const [globalSum, setGlobalSum] = useState(100); 
            const [isHealthy, setIsHealthy] = useState(false);
            const [productSettings, setProductSettings] = useState({});
            const [selectedProducts, setSelectedProducts] = useState({});

            useEffect(() => {
                const initialSettings = {};
                const initialSelected = {};
                PRODUCTS.forEach(p => {
                    initialSettings[p.id] = { 
                        sumAssured: p.id === 'HCAB2_HCAR2' ? 1 : 1000000, 
                        term: p.terms[p.terms.length - 1] 
                    };
                    initialSelected[p.id] = true;
                });
                setProductSettings(initialSettings);
                setSelectedProducts(initialSelected);
            }, []);

            const toggleProduct = (id) => {
                setSelectedProducts(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const handleSettingChange = (id, field, value) => {
                setProductSettings(prev => ({
                    ...prev,
                    [id]: { ...prev[id], [field]: Number(value) }
                }));
            };

            const handleGlobalSumChange = (val) => {
                setGlobalSum(val);
                const newSum = parseInt(val);
                if (!isNaN(newSum) && newSum >= 50) {
                    setProductSettings(prev => {
                        const nextSettings = { ...prev };
                        Object.keys(nextSettings).forEach(id => {
                            if (id !== 'HCAB2_HCAR2') {
                                nextSettings[id] = { ...nextSettings[id], sumAssured: newSum * 10000 };
                            }
                        });
                        return nextSettings;
                    });
                }
            };

            const calculateResult = (product) => {
                const settings = productSettings[product.id];
                if (!settings) return null;

                let { sumAssured, term } = settings;
                const isCombo = product.id === 'HCAB2_HCAR2';
                const units = isCombo ? sumAssured : sumAssured / product.rateUnit;
                const maxAllowedAge = product.getMaxAge(term);
                const isUninsurable = age < product.minAge || age > maxAllowedAge;

                let firstYearPremium = 0;
                let cumulativePremium = 0;
                let calculatedMaxAge = product.maxCoverageAgeNum;

                if (!isUninsurable) {
                    const isMale = gender === 'M';
                    if (isCombo) {
                        const hcabRate = isMale ? rateHCAB2_M[age] : rateHCAB2_F[age];
                        const hcarRate = isMale ? rateHCAR2_M[age] : rateHCAR2_F[age];
                        firstYearPremium = Math.round((hcabRate + hcarRate) * units);
                        cumulativePremium = firstYearPremium * term;
                    } else if (product.id === '1TED') {
                        const initialRate = isMale ? rate1TED_Initial_M[age] : rate1TED_Initial_F[age];
                        firstYearPremium = Math.round(initialRate * units);
                        cumulativePremium = firstYearPremium;
                        for (let a = age + 1; a <= 75; a++) {
                            const renewalRate = isMale ? rate1TED_Renewal_M[a - 1] : rate1TED_Renewal_F[a - 1];
                            if(renewalRate) cumulativePremium += Math.round(renewalRate * units);
                        }
                    } else if (product.id === '10TDD') {
                        let currentRenewalAge = age;
                        cumulativePremium = 0;
                        while (currentRenewalAge <= 70) {
                            const indexOffset = currentRenewalAge - 20;
                            const currentRate = isMale ? rate10TDD_M[indexOffset] : rate10TDD_F[indexOffset];
                            if(currentRenewalAge === age) firstYearPremium = Math.round(currentRate * units);
                            cumulativePremium += Math.round(currentRate * units * 10);
                            currentRenewalAge += 10;
                        }
                        calculatedMaxAge = (currentRenewalAge - 10) + 9; 
                    } else {
                        firstYearPremium = Math.round(getBaseRate(product.id, age, gender, term) * units);
                        cumulativePremium = firstYearPremium * term;
                    }
                }

                const coverages = product.getCoverage(sumAssured, isHealthy, age);
                const dbInfo = product.getDeathBenefit ? product.getDeathBenefit(isCombo ? 0 : sumAssured, firstYearPremium, term) : null;
                const deathBenefitText = dbInfo ? `${dbInfo.label}: ${formatSysCcy(dbInfo.amount)}` : null;

                return { 
                    firstYearPremium, 
                    cumulativePremium, 
                    coverages, 
                    isUninsurable, 
                    maxAllowedAge, 
                    calculatedMaxAge,
                    deathBenefitText
                };
            };

            // 用來記錄前一次觸發排序的變數，以及固定的商品排序
            const prevSortDeps = useRef({ age: null, gender: null, globalSum: null });
            const orderRef = useRef([]);

            const activeProducts = useMemo(() => {
                if (Object.keys(productSettings).length === 0) return [];

                // 1. 先計算所有有勾選的商品結果
                const calculatedProducts = PRODUCTS.filter(p => selectedProducts[p.id]).map(product => {
                    const result = calculateResult(product);
                    return { product, result, settings: productSettings[product.id] };
                });

                // 2. 判斷是否有更動到「性別、年齡、全域預設保額」
                const currentDepsChanged =
                    prevSortDeps.current.age !== age ||
                    prevSortDeps.current.gender !== gender ||
                    prevSortDeps.current.globalSum !== globalSum;

                if (currentDepsChanged || orderRef.current.length === 0) {
                    // 條件有變：重新依保費高低排序
                    calculatedProducts.sort((a, b) => {
                        const isRiderA = a.product.type === '附約';
                        const isRiderB = b.product.type === '附約';
                        if (isRiderA !== isRiderB) return isRiderA ? 1 : -1;
                        if (a.result.isUninsurable !== b.result.isUninsurable) return a.result.isUninsurable ? 1 : -1;
                        return b.result.firstYearPremium - a.result.firstYearPremium;
                    });
                    
                    // 記錄此次排序的順序與觸發變數狀態
                    orderRef.current = calculatedProducts.map(p => p.product.id);
                    prevSortDeps.current = { age, gender, globalSum };

                    return calculatedProducts;
                } else {
                    // 條件未變（例如只改單一商品年期/保額）：維持上次的順序
                    const ordered = [];
                    const calcMap = {};
                    calculatedProducts.forEach(p => { calcMap[p.product.id] = p; });

                    orderRef.current.forEach(id => {
                        if (calcMap[id]) {
                            ordered.push(calcMap[id]);
                            delete calcMap[id];
                        }
                    });
                    
                    // 若有新增勾選的商品，附加到最後面
                    Object.values(calcMap).forEach(p => ordered.push(p));
                    orderRef.current = ordered.map(p => p.product.id);

                    return ordered;
                }
            }, [age, gender, globalSum, isHealthy, productSettings, selectedProducts]);

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* 標題區 */}
                        <header className="bg-white rounded-2xl shadow-sm p-6 flex flex-col md:flex-row items-start md:items-center justify-between border border-slate-100 relative overflow-hidden">
                            <div className="relative z-10">
                                <h1 className="text-2xl font-black text-slate-800 flex items-center gap-2">
                                    <i className="fa-solid fa-shield-heart text-indigo-600"></i>
                                    癌症&amp;重大一次金給付商品保費試算系統
                                </h1>
                                <p className="text-slate-500 mt-1.5 text-sm font-semibold flex items-center gap-2">
                                    <span className="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs">by inaba 開發</span>
                                    快速試算首年保費、累積保費與重點保障
                                </p>
                            </div>

                            <div className="mt-4 md:mt-0 flex items-center gap-3 bg-indigo-50 p-2.5 rounded-xl border border-indigo-100 shadow-inner z-10">
                                <span className={`text-sm font-semibold ${!isHealthy ? 'text-indigo-800' : 'text-slate-400'}`}>標準體位</span>
                                <button 
                                    onClick={() => setIsHealthy(!isHealthy)}
                                    className={`relative inline-flex h-7 w-14 items-center rounded-full transition-colors duration-300 focus:outline-none ${isHealthy ? 'bg-emerald-500' : 'bg-slate-300'}`}
                                >
                                    <span className={`inline-block h-5 w-5 transform rounded-full bg-white transition-transform duration-300 shadow-sm ${isHealthy ? 'translate-x-8' : 'translate-x-1'}`} />
                                </button>
                                <span className={`text-sm font-semibold flex items-center gap-1 ${isHealthy ? 'text-emerald-700' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-heart-pulse"></i> 體檢達標 (外溢加倍)
                                </span>
                            </div>
                        </header>

                        {/* 參數控制區 */}
                        <div className="bg-white rounded-2xl shadow-sm p-6 border border-slate-100 space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label className="text-sm font-bold text-slate-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-user"></i> 投保性別</label>
                                    <div className="flex bg-slate-100 rounded-lg p-1">
                                        <button className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${gender === 'M' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`} onClick={() => setGender('M')}>男性</button>
                                        <button className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${gender === 'F' ? 'bg-white shadow text-rose-500' : 'text-slate-500'}`} onClick={() => setGender('F')}>女性</button>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-sm font-bold text-slate-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-calendar"></i> 投保年齡</label>
                                    <div className="relative">
                                        <input type="number" value={age} onChange={(e) => setAge(parseInt(e.target.value) || 0)} className="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 pl-4 pr-10 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500" min="0" max="80" />
                                        <span className="absolute right-4 top-2.5 text-slate-400 text-sm font-bold">歲</span>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-sm font-bold text-slate-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-sack-dollar"></i> 全域預設保額</label>
                                    <div className="relative">
                                        <input type="number" value={globalSum} onChange={(e) => handleGlobalSumChange(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 pl-4 pr-10 font-bold text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" min="50" step="10" />
                                        <span className="absolute right-4 top-2.5 text-slate-400 text-sm font-bold">萬</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="pt-4 border-t border-slate-100">
                                <label className="text-xs font-bold text-slate-500 block mb-3">勾選欲比較的商品：</label>
                                <div className="flex flex-wrap gap-3">
                                    {PRODUCTS.map(p => (
                                        <label key={p.id} className={`flex items-center gap-2 px-3 py-1.5 rounded-full border cursor-pointer transition-all ${selectedProducts[p.id] ? 'bg-indigo-50 border-indigo-200 text-indigo-700 shadow-sm' : 'bg-white border-slate-200 text-slate-400 hover:bg-slate-50'}`}>
                                            <input type="checkbox" className="w-3.5 h-3.5 accent-indigo-600 rounded" checked={!!selectedProducts[p.id]} onChange={() => toggleProduct(p.id)} />
                                            <span className="text-sm font-bold">{p.englishCode}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* 商品卡片區 */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {activeProducts.map(({ product, result, settings }) => {
                                const isCombo = product.id === 'HCAB2_HCAR2';
                                return (
                                    <div key={product.id} className={`relative bg-white rounded-2xl shadow-sm border overflow-hidden transition-all flex flex-col ${result.isUninsurable ? 'border-rose-300 opacity-90' : 'border-slate-200'}`}>
                                        {result.isUninsurable && (
                                            <div className="absolute top-0 left-0 w-full bg-rose-500 text-white text-xs font-bold py-1.5 text-center z-10 shadow-sm">超過投保年齡限制</div>
                                        )}
                                        
                                        <div className={`p-4 pb-3 border-b ${result.isUninsurable ? 'mt-6 bg-rose-50/50' : (product.type === '附約' ? 'mt-0 bg-amber-50/50 border-amber-100' : (isCombo ? 'mt-0 bg-purple-50/50 border-purple-100' : 'mt-0 bg-indigo-50/50 border-indigo-100'))}`}>
                                            <div className="flex justify-between items-start mb-2">
                                                <span className={`text-xs font-bold px-2 py-1 rounded-md ${product.type === '附約' ? 'bg-amber-100 text-amber-800' : (isCombo ? 'bg-purple-100 text-purple-800' : 'bg-indigo-100 text-indigo-800')}`}>{product.type}</span>
                                                <span className={`text-xs font-bold ${result.isUninsurable ? 'text-rose-600' : 'text-slate-500'}`}>投保限制: {product.minAge}~{result.maxAllowedAge}歲</span>
                                            </div>
                                            <h3 className={`font-bold text-lg leading-tight flex items-center gap-1.5 ${result.isUninsurable ? 'text-slate-500' : 'text-slate-800'}`}>
                                                <span className="font-black text-xl tracking-tight">{product.englishCode}</span>
                                                <span className="text-base font-bold text-slate-500">{product.chineseName}</span>
                                            </h3>
                                            <div className="mt-3 flex flex-col gap-1">
                                                <span className="text-xs font-bold text-slate-500 flex items-center gap-1"><i className="fa-regular fa-clock text-blue-500"></i> 保障至: {result.calculatedMaxAge}歲</span>
                                                <span className="text-xs font-bold text-slate-500 flex items-center gap-1"><i className="fa-solid fa-list-check text-emerald-500"></i> 項目數: {product.diseaseCount}</span>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-slate-50/80 border-b border-slate-100 grid grid-cols-2 gap-3 relative z-20">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">{isCombo ? '投保單位' : '保額 (萬)'}</label>
                                                {isCombo ? (
                                                    <select value={settings.sumAssured} onChange={(e) => handleSettingChange(product.id, 'sumAssured', e.target.value)} className="w-full bg-white border border-slate-300 rounded-md py-1.5 px-2 text-sm font-bold focus:ring-2 focus:ring-indigo-500">
                                                        {[1,2,3,4,5].map(v => <option key={v} value={v}>{v} 單位</option>)}
                                                    </select>
                                                ) : (
                                                    <input type="number" value={settings.sumAssured / 10000} onChange={(e) => handleSettingChange(product.id, 'sumAssured', (parseInt(e.target.value) || 0) * 10000)} className="w-full bg-white border border-slate-300 rounded-md py-1.5 px-2 text-sm font-bold focus:ring-2 focus:ring-indigo-500" min="10" step="10" />
                                                )}
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">繳費年期</label>
                                                <select value={settings.term} onChange={(e) => handleSettingChange(product.id, 'term', e.target.value)} className="w-full bg-white border border-slate-300 rounded-md py-1.5 px-2 text-sm font-bold focus:ring-2 focus:ring-indigo-500">
                                                    {product.terms.map(t => <option key={t} value={t}>{t} 年期</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <div className={`p-4 grid grid-cols-2 gap-4 ${result.isUninsurable ? 'opacity-40 grayscale' : ''}`}>
                                            <div>
                                                <p className="text-xs font-bold text-slate-500 mb-1">首年年繳保費</p>
                                                <p className="text-xl font-black text-rose-600">{result.isUninsurable ? '-' : formatSysCcy(result.firstYearPremium)}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs font-bold text-slate-500 mb-1 truncate">{product.id === '1TED' ? '預估至75歲' : product.id === '10TDD' ? `預估至${result.calculatedMaxAge}歲` : '累積應繳保費'}</p>
                                                <p className="text-lg font-bold text-slate-700">{result.isUninsurable ? '-' : formatSysCcy(result.cumulativePremium)}</p>
                                            </div>
                                        </div>

                                        <div className={`p-4 flex-1 flex flex-col border-t border-slate-100 ${result.isUninsurable ? 'opacity-40 bg-slate-50' : 'bg-white'}`}>
                                            <p className="text-xs font-black text-slate-600 mb-3 flex items-center gap-1">
                                                <i className={`fa-solid fa-heart-pulse ${isHealthy && age >= 16 && !result.isUninsurable ? 'text-emerald-500' : 'text-slate-400'}`}></i> 重點保障項目 (一次金)
                                            </p>
